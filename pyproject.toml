[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "generate-tech-stack-mcp"
version = "0.2.0"
description = "Generate a visual technology-stack inventory (TECH_STACK.html) from any codebase — languages, frameworks, databases, AI SDKs, testing, and infra. CLI + MCP server, stdlib-only scanner."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ashutosh Kumar" }]
requires-python = ">=3.10"
dependencies = ["mcp>=1.0.0"]
keywords = ["mcp", "mcp-server", "tech-stack", "dependencies", "inventory", "static-analysis", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Documentation",
]

[project.scripts]
generate-tech-stack-mcp = "generate_tech_stack_mcp.server:main"
generate-tech-stack = "generate_tech_stack_mcp.analyze:main"

[project.urls]
Homepage = "https://github.com/askuma/generate-tech-stack"
Repository = "https://github.com/askuma/generate-tech-stack"
"Live Demo" = "https://askuma.github.io/generate-tech-stack/"

[tool.setuptools]
packages = ["generate_tech_stack_mcp"]
